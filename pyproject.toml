[project]
name = "complaintexp"
version = "0.2.0"
description = "Experiment harness: on-prem vs Azure-hosted LLMs for drafting customer complaint replies"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Real NER-based pseudonymisation (names, places). Without it only regex
# recognisers run (emails, IBANs, phones, national numbers, order numbers).
redaction = [
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
cexp = "complaintexp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaintexp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ner: needs the `redaction` extra and spaCy models (skipped otherwise)",
]
