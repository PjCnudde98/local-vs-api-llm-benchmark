# Axes for LLM-generated synthetic complaints (plan, "Test dataset").
# Adjust language weights to your real inflow. Replace/extend scenario seeds with
# anonymised real complaint scenarios (what happened, not who it happened to).
languages: {nl: 0.5, fr: 0.3, en: 0.2}

types: [delivery, damage, billing, refund, staff, repeat]

difficulties:
  - simple          # polite and short
  - angry           # angry or sarcastic
  - rambling        # long, off-topic details
  - multi_issue     # two or three problems in one message
  - legal           # legal or press threats
  - out_of_policy   # asks for something the policy does not allow

pii_patterns:       # at least a few of these per complaint
  - full name
  - home address
  - phone number
  - email address
  - IBAN
  - order number (format ORD-1234567)
  - Belgian national register number (format 85.07.30-033.28)
  - signature block or pasted email thread

sensitive_context: [none, none, none, health or disability, bereavement, financial hardship]

# "Today" for every generated complaint: a working day in this range, picked by the
# harness. Dates in the complaint and its data must fit it (the policy counts from it).
received_between: ["2026-09-01", "2026-11-06"]

# -- per tier (plan: "Task complexity ladder"; 25 complaints per tier) -----------
tiers:
  1:  # classify: the harness picks the labels, the generator writes a matching complaint
    urgency: [low, normal, normal, high]
    sentiment: [neutral, negative, negative, very_negative, positive]
    difficulties: [simple, angry, rambling]
  2:  # extract: the generator returns the fields it planted, copied verbatim
    remedies: [refund, replacement, redelivery, voucher, apology, information]
    deadline_share: 0.5          # share of complaints that set a deadline
    difficulties: [simple, rambling, multi_issue]
  3:  # simple draft: one issue, clear policy match
    difficulties: [simple]
  4:  # complex draft
    difficulties: [angry, rambling, multi_issue, legal, out_of_policy, mixed_language]
  5:  # policy reasoning with tools. Each case fixes the gold decision under prompts/policy.md;
      # the generator writes the complaint and tool data that make it so.
      # Update these cases (and the rule numbers) whenever prompts/policy.md changes.
    cases:
      - {decision: refund, situation: "parcel more than 3 working days late, customer asks for a refund", policy_rule: 1}
      - {decision: redelivery, situation: "parcel more than 3 working days late, customer still wants the item", policy_rule: 1}
      - {decision: replacement, situation: "damaged on arrival, photo sent within 14 days of delivery, customer wants a new one", policy_rule: 3}
      - {decision: decline, situation: "damaged on arrival, but the first photo arrived more than 14 days after delivery", policy_rule: 3}
      - {decision: escalate, situation: "product stopped working after three months of normal use", policy_rule: 4}
      - {decision: refund, situation: "unused item, return request registered within 30 days of delivery", policy_rule: 5}
      - {decision: voucher, situation: "return request 40-60 days after delivery for an unused item", policy_rule: 5}
      - {decision: refund, situation: "duplicate charge that the payment record confirms", policy_rule: 6}
      - {decision: decline, situation: "customer claims a duplicate charge but the payment record shows one charge", policy_rule: 6}
      - {decision: escalate, situation: "customer threatens legal action or the press over a late refund", policy_rule: 9}
      - {decision: refund, situation: "return request after day 30, but the contact history shows an agent confirmed a full refund in writing", policy_rule: 10}
  6:  # long context: an email thread with a contradiction. `rules` are the policy rules that
      # resolve it: they become the retrieved pages (plus one unrelated rule) and the
      # generator must write key facts that follow them.
    messages: [8, 14]
    contradictions:
      - {text: "an agent promised a refund in writing; a later automated mail says the return window has closed", rules: [5, 10]}
      - {text: "the customer first says the item was unused, later mentions using it twice", rules: [5]}
      - {text: "two agents gave different delivery dates", rules: [1]}
      - {text: "the customer changes the requested remedy halfway through the thread", rules: [3]}
